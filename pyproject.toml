[project]
name = "mcp-sql-server"
version = "0.1.0"
description = "Read-only MCP investigator for a fixed SQL Server database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.16.0",
    "pyodbc>=5.2.0",
]

[project.scripts]
mcp-sql-server = "mcp_sql_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
